<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" rx="16" fill="url(#bg2)" stroke="#334155" stroke-width="1.5"/>

  <text x="32" y="40" fill="#f8fafc" font-size="20" font-weight="700">Evoluzione Readiness Multipiattaforma v1 → v2 per Sottosistema (4 Target)</text>
  <text x="32" y="62" fill="#94a3b8" font-size="13">Readiness globale salita dal 57% (v1) al 74% (v2, +17 pt) grazie a Target, translate_rel, join_rel, KitEnv Unix e Matrice Download</text>

  <!-- Legend -->
  <g transform="translate(32, 82)" font-size="12">
    <rect x="0" y="-10" width="14" height="14" rx="3" fill="#10b981"/>
    <text x="20" y="1" fill="#e2e8f0" font-weight="600">Già Pronto Cross-Platform (74% in v2 vs 57% in v1)</text>

    <rect x="330" y="-10" width="14" height="14" rx="3" fill="#f59e0b"/>
    <text x="350" y="1" fill="#e2e8f0" font-weight="600">Da Adattare / Rifinire (8% in v2 vs 21% in v1)</text>

    <rect x="640" y="-10" width="14" height="14" rx="3" fill="#ef4444"/>
    <text x="660" y="1" fill="#e2e8f0" font-weight="600">Win32 da Astrarre in #[cfg(unix)] (18% in v2 vs 22% in v1)</text>
  </g>

  <!-- Bars area: x=260 to x=810 (width 550px = 100%) -->
  <g transform="translate(32, 118)" font-size="12">
    <g transform="translate(238, 0)" stroke="#334155" stroke-width="1" stroke-dasharray="3,3">
      <line x1="0" y1="0" x2="0" y2="380"/>
      <line x1="137.5" y1="0" x2="137.5" y2="380"/>
      <line x1="275" y1="0" x2="275" y2="380"/>
      <line x1="412.5" y1="0" x2="412.5" y2="380"/>
      <line x1="550" y1="0" x2="550" y2="380"/>
    </g>

    <!-- Row 1: Frontend React/TS (96% -> 96%) -->
    <g transform="translate(0, 14)">
      <text x="0" y="13" fill="#f8fafc" font-weight="600">1. UI React &amp; Workbench (`ui/src/**`)</text>
      <rect x="238" y="0" width="528" height="18" rx="4" fill="#10b981"/>
      <rect x="766" y="0" width="22" height="18" rx="2" fill="#f59e0b"/>
      <text x="798" y="13" fill="#10b981" font-weight="700">96% (v1: 96%)</text>
    </g>

    <!-- Row 2: Runtime Shell Scripts (90% -> 98% with bashrc __atollo_p) -->
    <g transform="translate(0, 46)">
      <text x="0" y="13" fill="#f8fafc" font-weight="600">2. Runtime Scripts (`bashrc`, `agy`, `gradle`)</text>
      <rect x="238" y="0" width="539" height="18" rx="4" fill="#10b981"/>
      <rect x="777" y="0" width="11" height="18" rx="2" fill="#f59e0b"/>
      <text x="798" y="13" fill="#10b981" font-weight="700">98% (+8%)</text>
    </g>

    <!-- Row 3: Kit, Env, Detect, Versions (92% -> 98% with Target, XDG, side_by_side) -->
    <g transform="translate(0, 78)">
      <text x="0" y="13" fill="#f8fafc" font-weight="600">3. Kit, Env &amp; Versioni (`kit.rs`, `env.rs`, `versions/`)</text>
      <rect x="238" y="0" width="539" height="18" rx="4" fill="#10b981"/>
      <rect x="777" y="0" width="11" height="18" rx="2" fill="#f59e0b"/>
      <text x="798" y="13" fill="#10b981" font-weight="700">98% (+6%)</text>
    </g>

    <!-- Row 4: IPC Commands & Setup Runner (88% -> 94% with Target availability & RunLock) -->
    <g transform="translate(0, 110)">
      <text x="0" y="13" fill="#f8fafc" font-weight="600">4. Tauri IPC &amp; Runner (`commands/`, `runner.rs`)</text>
      <rect x="238" y="0" width="517" height="18" rx="4" fill="#10b981"/>
      <rect x="755" y="0" width="33" height="18" rx="2" fill="#f59e0b"/>
      <text x="798" y="13" fill="#10b981" font-weight="700">94% (+6%)</text>
    </g>

    <!-- Row 5: Net, Archives & Checksums (78% -> 92% with safe_join, TarXz, SingleThen, 0755) -->
    <g transform="translate(0, 142)">
      <text x="0" y="13" fill="#f8fafc" font-weight="600">5. Rete, Archivi &amp; Hash (`net/archive.rs`)</text>
      <rect x="238" y="0" width="506" height="18" rx="4" fill="#10b981"/>
      <rect x="744" y="0" width="22" height="18" fill="#f59e0b"/>
      <rect x="766" y="0" width="22" height="18" rx="2" fill="#ef4444"/>
      <text x="798" y="13" fill="#10b981" font-weight="700">92% (+14%)</text>
    </g>

