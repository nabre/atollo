    <g transform="translate(0, 174)">
      <text x="0" y="13" fill="#38bdf8" font-weight="700">6. Installer &amp; Catalogo (`install/`, `catalog.rs`)</text>
      <rect x="238" y="0" width="462" height="18" rx="4" fill="#10b981"/>
      <rect x="700" y="0" width="66" height="18" fill="#f59e0b"/>
      <rect x="766" y="0" width="22" height="18" rx="2" fill="#ef4444"/>
      <text x="798" y="13" fill="#38bdf8" font-weight="800">84% (+54%!)</text>
    </g>

    <!-- Row 7: Agents Sync & Relocation (65% -> 72% with Unix venv relocation) -->
    <g transform="translate(0, 206)">
      <text x="0" y="13" fill="#f8fafc" font-weight="600">7. Agenti IA Sync &amp; Relocate (`agents/`)</text>
      <rect x="238" y="0" width="396" height="18" rx="4" fill="#10b981"/>
      <rect x="634" y="0" width="77" height="18" fill="#f59e0b"/>
      <rect x="711" y="0" width="77" height="18" rx="2" fill="#ef4444"/>
      <text x="798" y="13" fill="#38bdf8" font-weight="700">72% (+7%)</text>
    </g>

    <!-- Row 8: Editor VSCodium & Extensions (48% -> 56% with CodeLLDB & Server multi-target) -->
    <g transform="translate(0, 238)">
      <text x="0" y="13" fill="#f8fafc" font-weight="600">8. Editor VSCodium &amp; Ext (`editor/`)</text>
      <rect x="238" y="0" width="308" height="18" rx="4" fill="#10b981"/>
      <rect x="546" y="0" width="88" height="18" fill="#f59e0b"/>
      <rect x="634" y="0" width="154" height="18" rx="2" fill="#ef4444"/>
      <text x="798" y="13" fill="#fbbf24" font-weight="700">56% (+8%)</text>
    </g>

    <!-- Row 9: Databases & Web Server Pools (50% -> 52%) -->
    <g transform="translate(0, 270)">
      <text x="0" y="13" fill="#f8fafc" font-weight="600">9. Runtime DB &amp; Server Web (`db/`, `servers/`)</text>
      <rect x="238" y="0" width="286" height="18" rx="4" fill="#10b981"/>
      <rect x="524" y="0" width="176" height="18" fill="#f59e0b"/>
      <rect x="700" y="0" width="88" height="18" rx="2" fill="#ef4444"/>
      <text x="798" y="13" fill="#fbbf24" font-weight="700">52% (+2%)</text>
    </g>

    <!-- Row 10: Keyring & Credentials (20% -> 20%) -->
    <g transform="translate(0, 302)">
      <text x="0" y="13" fill="#f8fafc" font-weight="600">10. Keyring Antigravity (`agents/keyring.rs`)</text>
      <rect x="238" y="0" width="110" height="18" rx="4" fill="#10b981"/>
      <rect x="348" y="0" width="55" height="18" fill="#f59e0b"/>
      <rect x="403" y="0" width="385" height="18" rx="2" fill="#ef4444"/>
      <text x="798" y="13" fill="#f87171" font-weight="700">20% (=)</text>
    </g>

    <!-- Row 11: Terminal Integration (15% -> 18%) -->
    <g transform="translate(0, 334)">
      <text x="0" y="13" fill="#f8fafc" font-weight="600">11. Terminale Portabile (`editor/wterm.rs`)</text>
      <rect x="238" y="0" width="99" height="18" rx="4" fill="#10b981"/>
      <rect x="337" y="0" width="66" height="18" fill="#f59e0b"/>
      <rect x="403" y="0" width="385" height="18" rx="2" fill="#ef4444"/>
      <text x="798" y="13" fill="#f87171" font-weight="700">18% (+3%)</text>
    </g>

    <!-- Row 12: OS Layer (12% -> 15%) -->
    <g transform="translate(0, 366)">
      <text x="0" y="13" fill="#f8fafc" font-weight="600">12. Astrazioni Sistema (`tauri/src/os/**`)</text>
      <rect x="238" y="0" width="82.5" height="18" rx="4" fill="#10b981"/>
      <rect x="320.5" y="0" width="44" height="18" fill="#f59e0b"/>
      <rect x="364.5" y="0" width="423.5" height="18" rx="2" fill="#ef4444"/>
      <text x="798" y="13" fill="#f87171" font-weight="700">15% (+3%)</text>
    </g>
