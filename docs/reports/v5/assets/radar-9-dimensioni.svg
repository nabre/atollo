      .poly-target { fill: none; stroke: #8250df; stroke-width: 1.8; stroke-dasharray: 2,4; }
      .dot-v4 { fill: #0969da; }
      .dot-v5 { fill: #1a7f37; stroke: #ffffff; stroke-width: 1.5; }
      .sw-v4 { stroke: #0969da; }
      .sw-v5 { stroke: #1a7f37; }
      .sw-t { stroke: #8250df; }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .title { font-size: 19px; font-weight: 700; fill: #1f2328; }
      .subtitle { font-size: 12px; fill: #59636e; }
      .label { font-size: 12px; font-weight: 600; fill: #1f2328; }
      .score { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #1a7f37; }
      .delta { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10px; font-weight: 400; fill: #0969da; }
      .ring { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 9px; fill: #6e7781; }
      .legend { font-size: 11px; fill: #1f2328; }
      .hi { font-size: 11px; font-weight: 600; fill: #1a7f37; }
      .note { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 9px; fill: #59636e; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; }
        .panel { fill: #161b22; stroke: #30363d; }
        .card { fill: #0d1117; stroke: #30363d; }
        .grid { stroke: #21262d; }
        .axis { stroke: #30363d; }
        .sep { stroke: #21262d; }
        .poly-v4 { fill: rgba(88, 166, 255, 0.10); stroke: #58a6ff; }
        .poly-v5 { fill: rgba(63, 185, 80, 0.20); stroke: #3fb950; }
        .poly-target { stroke: #a371f7; }
        .dot-v4 { fill: #58a6ff; }
        .dot-v5 { fill: #3fb950; stroke: #0d1117; }
        .sw-v4 { stroke: #58a6ff; }
        .sw-v5 { stroke: #3fb950; }
        .sw-t { stroke: #a371f7; }
        .title { fill: #f0f6fc; }
        .subtitle { fill: #8b949e; }
        .label { fill: #e6edf3; }
        .score { fill: #3fb950; }
        .delta { fill: #58a6ff; }
        .ring { fill: #6e7681; }
        .legend { fill: #c9d1d9; }
        .hi { fill: #3fb950; }
        .note { fill: #8b949e; }
