  <rect width="920" height="600" rx="12" class="bg"/>
  <rect x="16" y="16" width="888" height="568" rx="10" class="panel"/>

  <text x="40" y="50" class="title">Atollo — Valutazione su 9 Dimensioni, Revisione v5 (HEAD a8aad6c)</text>
  <text x="40" y="70" class="subtitle">v4 (18698f9) 92,8/100 → v5 Attuale 95,8/100 (+3,0) → Target Post-v5 98,6/100</text>

  <!-- Centro (370, 325), raggio 190; 9 assi ogni 40 gradi a partire da -90.
       0 Architettura        v4 96  v5 97  T 99
       1 Isolamento Windows  v4 98  v5 98  T 100
       2 Rilocazione USB     v4 93  v5 97  T 99
       3 Sicurezza           v4 91  v5 95  T 98
       4 UX                  v4 93  v5 95  T 98
       5 Ecosistema AI       v4 96  v5 97  T 99
       6 Dati / DB           v4 92  v5 93  T 98
       7 Qualità / Test      v4 95  v5 97  T 98
       8 Multi-OS            v4 81  v5 91  T 97 -->

  <!-- Poligoni di riferimento (20, 40, 60, 80, 100) -->
  <polygon class="grid" points="370,287 394,296 407,318 403,344 383,361 357,361 337,344 333,318 346,296"/>
  <polygon class="grid" points="370,249 419,267 445,312 436,363 396,396 344,396 304,363 295,312 321,267"/>
