  <line x1="370" y1="325" x2="492" y2="179" class="axis"/>
  <line x1="370" y1="325" x2="557" y2="292" class="axis"/>
  <line x1="370" y1="325" x2="535" y2="420" class="axis"/>
  <line x1="370" y1="325" x2="435" y2="504" class="axis"/>
  <line x1="370" y1="325" x2="305" y2="504" class="axis"/>
  <line x1="370" y1="325" x2="205" y2="420" class="axis"/>
  <line x1="370" y1="325" x2="183" y2="292" class="axis"/>
  <line x1="370" y1="325" x2="248" y2="179" class="axis"/>

