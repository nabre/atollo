<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="100%" height="100%" role="img" aria-labelledby="t d">
  <title id="t">Valutazione su 9 dimensioni: v4 contro v5</title>
  <desc id="d">Radar delle 9 dimensioni di Atollo. v4 (18698f9) media 92,8; v5 (a8aad6c) media 95,8; target post-v5 98,6.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
