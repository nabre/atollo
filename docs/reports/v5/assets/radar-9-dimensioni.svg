  <!-- Etichette -->
  <text x="370" y="108" text-anchor="middle" class="label">1. Architettura &amp; Modularità</text>
  <text x="370" y="123" text-anchor="middle" class="score">97/100 <tspan class="delta">(+1 vs v4)</tspan></text>

  <text x="508" y="168" text-anchor="start" class="label">2. Isolamento Windows</text>
  <text x="508" y="183" text-anchor="start" class="score">98/100 <tspan class="delta">(= v4)</tspan></text>

  <text x="570" y="288" text-anchor="start" class="label">3. Rilocazione &amp; USB</text>
  <text x="570" y="303" text-anchor="start" class="score">97/100 <tspan class="delta">(+4 vs v4)</tspan></text>

  <text x="548" y="428" text-anchor="start" class="label">4. Sicurezza &amp; Guard-Rail</text>
  <text x="548" y="443" text-anchor="start" class="score">95/100 <tspan class="delta">(+4 vs v4)</tspan></text>

  <text x="442" y="528" text-anchor="start" class="label">5. UX, UI &amp; Accessibilità</text>
  <text x="442" y="543" text-anchor="start" class="score">95/100 <tspan class="delta">(+2 vs v4)</tspan></text>

  <text x="298" y="528" text-anchor="end" class="label">6. Ecosistema AI &amp; Agents</text>
  <text x="298" y="543" text-anchor="end" class="score">97/100 <tspan class="delta">(+1 vs v4)</tspan></text>

  <text x="192" y="428" text-anchor="end" class="label">7. Dati, DB &amp; Backup</text>
  <text x="192" y="443" text-anchor="end" class="score">93/100 <tspan class="delta">(+1 vs v4)</tspan></text>

  <text x="170" y="288" text-anchor="end" class="label">8. Qualità &amp; Test (958 test)</text>
  <text x="170" y="303" text-anchor="end" class="score">97/100 <tspan class="delta">(+2 vs v4)</tspan></text>

  <text x="235" y="168" text-anchor="end" class="label">9. Readiness Multi-OS</text>
  <text x="235" y="183" text-anchor="end" class="score">91/100 <tspan class="delta">(+10 vs v4)</tspan></text>

  <!-- Legenda -->
  <rect x="695" y="95" width="190" height="465" rx="8" class="card"/>
  <text x="712" y="122" class="label">Legenda</text>

  <line x1="712" y1="145" x2="740" y2="145" class="sw-v5" stroke-width="3"/>
  <circle cx="726" cy="145" r="4" class="dot-v5"/>
