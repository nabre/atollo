  <line x1="712" y1="170" x2="740" y2="170" class="sw-v4" stroke-width="2" stroke-dasharray="6,3"/>
  <circle cx="726" cy="170" r="3" class="dot-v4"/>
  <text x="748" y="174" class="legend">v4 Baseline (92,8/100)</text>

  <line x1="712" y1="195" x2="740" y2="195" class="sw-t" stroke-width="1.8" stroke-dasharray="2,4"/>
  <text x="748" y="199" class="legend">Target Post-v5 (98,6)</text>

  <line x1="712" y1="218" x2="868" y2="218" class="sep"/>
  <text x="712" y="240" class="label">Salti Chiave v4 → v5</text>

  <text x="712" y="264" class="hi">● Multi-OS (+10 pt)</text>
  <text x="712" y="280" class="note">Pacchetti per 6 sistemi,</text>
  <text x="712" y="292" class="note">catalogo 35/35 su 5 target</text>

  <text x="712" y="316" class="hi">● Rilocazione (+4 pt)</text>
  <text x="712" y="332" class="note">PORT-V4-01/02 chiusi,</text>
  <text x="712" y="344" class="note">conda offline (D-118)</text>

  <text x="712" y="368" class="hi">● Sicurezza (+4 pt)</text>
  <text x="712" y="384" class="note">SEC-V4-01/04 chiusi,</text>
  <text x="712" y="396" class="note">admin Caddy su socket</text>

  <text x="712" y="420" class="hi">● Test (+2 pt)</text>
  <text x="712" y="436" class="note">536 → 958 test (+78,7%)</text>
  <text x="712" y="448" class="note">780 Rust + 178 Vitest</text>

  <text x="712" y="472" class="hi">● UX (+2 pt)</text>
  <text x="712" y="488" class="note">Guida 9 capitoli, 63 basi,</text>
  <text x="712" y="500" class="note">impostazioni autosave</text>

  <line x1="712" y1="516" x2="868" y2="516" class="sep"/>
  <text x="712" y="536" class="note">Rilievi v4: 20 risolti,</text>
  <text x="712" y="548" class="note">5 parziali, 6 aperti</text>
</svg>
