      .grid { fill: none; stroke: #d8dee4; stroke-width: 1; }
      .axis { stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 3,3; }
      .sep { stroke: #d8dee4; stroke-width: 1; }
