<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f0f6fc; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; }
      .plat-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #e6edf3; }
      .plat-sub { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #8b949e; }
      .bar-bg { fill: #21262d; }
      .bar-ok { fill: #238636; }
      .bar-emu { fill: #3fb950; opacity: 0.78; }
      .bar-fix { fill: #d29922; }
      .bar-winonly { fill: #f85149; }
      .pct { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #f0f6fc; }
      .legend { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; fill: #c9d1d9; }
      .note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; fill: #8b949e; }
    </style>
  </defs>

  <rect width="920" height="540" rx="12" class="bg"/>
  <rect x="16" y="16" width="888" height="508" rx="10" class="panel"/>

  <text x="40" y="50" class="title">Readiness Multipiattaforma sui 35 Componenti del Catalogo — Baseline v4 (HEAD 18698f9)</text>
  <text x="40" y="70" class="subtitle">Stato dopo D-95 (ritiro Windows Terminal → 35 componenti), D-104 (layer OS Unix + CI check-unix) e D-105 (MariaDB Linux, VSCodium SHA-256, LLVM)</text>

  <!-- Legend -->
  <rect x="40" y="88" width="12" height="12" rx="3" class="bar-ok"/>
  <text x="58" y="98" class="legend">Nativo &amp; Funzionante</text>

  <rect x="200" y="88" width="12" height="12" rx="3" class="bar-emu"/>
  <text x="218" y="98" class="legend">Funzionante via Fallback x64 (Prism / Rosetta 2)</text>

  <rect x="505" y="88" width="12" height="12" rx="3" class="bar-fix"/>
  <text x="523" y="98" class="legend">Catalogo Pronto ma Bloccato da Path/Symlink/x64Only</text>

  <rect x="815" y="88" width="12" height="12" rx="3" class="bar-winonly"/>
  <text x="833" y="98" class="legend">Win-Only</text>

  <!-- Bar total width = 560px (16px per component out of 35) starting at x=240 -->

  <!-- 1. win32-x64: 35/35 native (100%) -->
  <text x="40" y="142" class="plat-label">Windows x64</text>
  <text x="40" y="158" class="plat-sub">win32-x64 (Tier 1 Prod)</text>
  <rect x="240" y="130" width="560" height="28" rx="5" class="bar-bg"/>
  <rect x="240" y="130" width="560" height="28" rx="5" class="bar-ok"/>
  <text x="812" y="149" class="pct">35/35 (100%)</text>
  <text x="240" y="174" class="note">Tutti i 35 componenti nativi x64, RMakeconf rilocato ad ogni avvio (D-105), 0 dipendenze host.</text>

  <!-- 2. win32-arm64: 22 native + 11 x64Only Prism + 2 missing x64Only (Julia, Bun) -->
  <text x="40" y="214" class="plat-label">Windows ARM64</text>
  <text x="40" y="230" class="plat-sub">win32-arm64 (Prism)</text>
  <rect x="240" y="202" width="560" height="28" rx="5" class="bar-bg"/>
  <rect x="240" y="202" width="352" height="28" rx="5" class="bar-ok"/>
  <rect x="592" y="202" width="176" height="28" class="bar-emu"/>
  <rect x="768" y="202" width="32" height="28" rx="3" class="bar-fix"/>
  <text x="812" y="221" class="pct">33/35 (94,3%)</text>
  <text x="240" y="246" class="note">22 nativi ARM64 + 11 via x64Only (Prism). Da fissare: Julia e Bun richiedono x64Only: true (PORT-V4-07).</text>

  <!-- 3. linux-x64: 26 ready + 5 blocked by path/exe (git/r relocate, mariadb/mongodb/vscodium .exe/backslash) + 4 win-only (php, apache, nginx, adminer) -->
  <text x="40" y="286" class="plat-label">Linux x64</text>
  <text x="40" y="302" class="plat-sub">linux-x64 (CI check-unix)</text>
  <rect x="240" y="274" width="560" height="28" rx="5" class="bar-bg"/>
  <rect x="240" y="274" width="416" height="28" rx="5" class="bar-ok"/>
  <rect x="656" y="274" width="80" height="28" class="bar-fix"/>
  <rect x="736" y="274" width="64" height="28" rx="3" class="bar-winonly"/>
  <text x="812" y="293" class="pct">31/35 cat. (88,6%)</text>
  <text x="240" y="318" class="note">MariaDB aggiunto (D-105). Da fissare: copy_tree symlink cross-device (/tmp→kit), .exe/backslash in db/editor (PORT-V4-01..05) + 4 web Win-only.</text>

  <!-- 4. darwin-arm64: 26 ready + 4 blocked by path/exe + 5 win/linux-only (php, apache, nginx, adminer, mariadb) -->
  <text x="40" y="358" class="plat-label">macOS Apple Silicon</text>
  <text x="40" y="374" class="plat-sub">darwin-arm64 (M1/M2/M3/M4)</text>
  <rect x="240" y="346" width="560" height="28" rx="5" class="bar-bg"/>
  <rect x="240" y="346" width="416" height="28" rx="5" class="bar-ok"/>
  <rect x="656" y="346" width="64" height="28" class="bar-fix"/>
  <rect x="720" y="346" width="80" height="28" rx="3" class="bar-winonly"/>
  <text x="812" y="365" class="pct">30/35 cat. (85,7%)</text>
  <text x="240" y="390" class="note">VSCodium SHA-256 registrato (D-105). Da fissare: bashrc Bash 3.2 (${var,,}), .exe/backslash, MariaDB via conda-forge osx-arm64.</text>

  <!-- 5. darwin-x64: 26 ready (Cc via LLVM 20.1.7) + 4 blocked + 5 win/linux-only -->
  <text x="40" y="430" class="plat-label">macOS Intel x64</text>
  <text x="40" y="446" class="plat-sub">darwin-x64 (CI check-unix)</text>
  <rect x="240" y="418" width="560" height="28" rx="5" class="bar-bg"/>
  <rect x="240" y="418" width="416" height="28" rx="5" class="bar-ok"/>
  <rect x="656" y="418" width="64" height="28" class="bar-fix"/>
  <rect x="720" y="418" width="80" height="28" rx="3" class="bar-winonly"/>
  <text x="812" y="437" class="pct">30/35 cat. (85,7%)</text>
  <text x="240" y="462" class="note">Cc risolto cercando nelle ultime 100 release LLVM (20.1.7, D-105). Stessi 5 componenti da sbloccare via conda-forge/static-php-cli.</text>

  <!-- Footer Summary -->
  <line x1="40" y1="482" x2="880" y2="482" stroke="#21262d" stroke-width="1"/>
  <text x="40" y="504" class="legend">Progressione Compilazione Backend Rust su Unix: v3 = 0% (bloccato da 4 crate Win32) → v4 = 100% (`cargo check --bins --tests` verde in CI su Ubuntu &amp; macOS)</text>
</svg>
