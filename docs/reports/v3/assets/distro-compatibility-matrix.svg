<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="980" height="460" rx="16" fill="url(#bg3)" stroke="#1f2937" stroke-width="1.5"/>

  <text x="490" y="36" fill="#f9fafb" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" text-anchor="middle">
    Matrice Sintetica Strumenti Usabili (36 Componenti) × Distribuzione Sistema Operativo
  </text>
  <text x="490" y="58" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" text-anchor="middle">
    Numero di componenti del catalogo (su 36) usabili Out-of-the-Box (HEAD 39b74bc) vs Con Soluzioni Promosse in v3
  </text>

  <!-- Table Header -->
  <g transform="translate(30, 80)" font-family="system-ui, -apple-system, sans-serif">
    <rect x="0" y="0" width="920" height="36" rx="6" fill="#1f2937"/>
    <text x="14" y="23" fill="#f3f4f6" font-size="12" font-weight="700">DISTRIBUZIONE / EDIZIONE OS</text>
    <text x="330" y="23" fill="#f3f4f6" font-size="12" font-weight="700">ARCH / LIBC</text>
    <text x="470" y="23" fill="#f3f4f6" font-size="12" font-weight="700" text-anchor="middle">STATO HEAD (39b74bc)</text>
    <text x="630" y="23" fill="#10b981" font-size="12" font-weight="700" text-anchor="middle">CON SOLUZIONI v3</text>
    <text x="795" y="23" fill="#f3f4f6" font-size="12" font-weight="700" text-anchor="middle">VINCOLI / NOTE CHIAVE</text>

    <!-- Row 1: Windows 11 x64 -->
    <g transform="translate(0, 42)">
      <rect x="0" y="0" width="920" height="30" rx="4" fill="#111827" stroke="#1f2937"/>
      <text x="14" y="20" fill="#e5e7eb" font-size="12" font-weight="600">Windows 11 (22H2–24H2) / Win 10 (1809–22H2)</text>
      <text x="330" y="20" fill="#9ca3af" font-size="11.5">win32-x64 (UCRT)</text>
      <text x="470" y="20" fill="#10b981" font-size="12" font-weight="700" text-anchor="middle">36 / 36 (100%)</text>
      <text x="630" y="20" fill="#10b981" font-size="12" font-weight="700" text-anchor="middle">36 / 36 (100%)</text>
      <text x="795" y="20" fill="#9ca3af" font-size="11" text-anchor="middle">100% Nativo + Portable</text>
    </g>

    <!-- Row 4: Windows LTSC / Server / Sandbox -->
    <g transform="translate(0, 76)">
      <rect x="0" y="0" width="920" height="30" rx="4" fill="#111827" stroke="#1f2937"/>
      <text x="14" y="20" fill="#e5e7eb" font-size="12" font-weight="600">Windows 10/11 LTSC &amp; Server 2019–2025 / Sandbox</text>
      <text x="330" y="20" fill="#9ca3af" font-size="11.5">win32-x64 (No WebView2)</text>
      <text x="470" y="20" fill="#10b981" font-size="12" font-weight="700" text-anchor="middle">35 / 36 (97%)</text>
      <text x="630" y="20" fill="#10b981" font-size="12" font-weight="700" text-anchor="middle">36 / 36 (100%)</text>
      <text x="795" y="20" fill="#9ca3af" font-size="11" text-anchor="middle">WebView2 Fixed Version nel kit</text>
    </g>

    <!-- Row 5: macOS 14-15 Apple Silicon -->
    <g transform="translate(0, 110)">
      <rect x="0" y="0" width="920" height="30" rx="4" fill="#111827" stroke="#1f2937"/>
      <text x="14" y="20" fill="#e5e7eb" font-size="12" font-weight="600">macOS 13–15 (Ventura / Sonoma / Sequoia) Apple Silicon</text>
      <text x="330" y="20" fill="#9ca3af" font-size="11.5">darwin-arm64 (libSystem)</text>
      <text x="470" y="20" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">30 / 36 (83%)</text>
      <text x="630" y="20" fill="#10b981" font-size="12" font-weight="700" text-anchor="middle">35 / 36 (97%)</text>
      <text x="795" y="20" fill="#9ca3af" font-size="11" text-anchor="middle">Tutti tranne Windows Terminal</text>
    </g>

    <!-- Row 7: Ubuntu 22.04/24.04 & Debian 12 -->
    <g transform="translate(0, 144)">
      <rect x="0" y="0" width="920" height="30" rx="4" fill="#111827" stroke="#1f2937"/>
      <text x="14" y="20" fill="#e5e7eb" font-size="12" font-weight="600">Ubuntu 22.04 / 24.04 LTS, Debian 12, Mint, Pop!_OS</text>
      <text x="330" y="20" fill="#9ca3af" font-size="11.5">linux-x64/arm64 (glibc ≥2.35)</text>
      <text x="470" y="20" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">31 / 36 (86%)</text>
      <text x="630" y="20" fill="#10b981" font-size="12" font-weight="700" text-anchor="middle">35 / 36 (97%)</text>
      <text x="795" y="20" fill="#9ca3af" font-size="11" text-anchor="middle">Target primario Linux (35/35 Unix)</text>
    </g>

    <!-- Row 8: Fedora 40/41 & RHEL 9 / Alma / Rocky -->
    <g transform="translate(0, 178)">
      <rect x="0" y="0" width="920" height="30" rx="4" fill="#111827" stroke="#1f2937"/>
      <text x="14" y="20" fill="#e5e7eb" font-size="12" font-weight="600">Fedora 40/41, RHEL 9, AlmaLinux 9, Rocky Linux 9</text>
      <text x="330" y="20" fill="#9ca3af" font-size="11.5">linux-x64/arm64 (glibc ≥2.34)</text>
      <text x="470" y="20" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">28 / 36 (78%)</text>
      <text x="630" y="20" fill="#10b981" font-size="12" font-weight="700" text-anchor="middle">35 / 36 (97%)</text>
      <text x="795" y="20" fill="#9ca3af" font-size="11" text-anchor="middle">Risolto libcrypt.so.1 / libssl.so.3</text>
    </g>

    <!-- Row 9: Arch Linux & openSUSE Tumbleweed -->
    <g transform="translate(0, 212)">
      <rect x="0" y="0" width="920" height="30" rx="4" fill="#111827" stroke="#1f2937"/>
      <text x="14" y="20" fill="#e5e7eb" font-size="12" font-weight="600">Arch Linux, Manjaro, EndeavourOS, openSUSE Tumbleweed</text>
      <text x="330" y="20" fill="#9ca3af" font-size="11.5">linux-x64/arm64 (glibc ≥2.39)</text>
      <text x="470" y="20" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">29 / 36 (81%)</text>
      <text x="630" y="20" fill="#10b981" font-size="12" font-weight="700" text-anchor="middle">35 / 36 (97%)</text>
      <text x="795" y="20" fill="#9ca3af" font-size="11" text-anchor="middle">Librerie rolling isolate nel kit</text>
    </g>

    <!-- Row 10: Debian 11 / Ubuntu 20.04 / Leap 15.6 -->
    <g transform="translate(0, 246)">
      <rect x="0" y="0" width="920" height="30" rx="4" fill="#111827" stroke="#1f2937"/>
      <text x="14" y="20" fill="#fbbf24" font-size="12" font-weight="600">Debian 11, Ubuntu 20.04, openSUSE Leap 15.6, RHEL 8</text>
      <text x="330" y="20" fill="#9ca3af" font-size="11.5">linux-x64 (glibc 2.28–2.31)</text>
      <text x="470" y="20" fill="#f59e0b" font-size="12" font-weight="700" text-anchor="middle">23 / 36 (64%)</text>
      <text x="630" y="20" fill="#10b981" font-size="12" font-weight="700" text-anchor="middle">35 / 36 (97%)</text>
      <text x="795" y="20" fill="#34d399" font-size="11" text-anchor="middle">Sysroot Conda glibc 2.39 + patchelf</text>
    </g>

    <!-- Row 11: Alpine Linux / Void musl -->
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="920" height="30" rx="4" fill="#111827" stroke="#1f2937"/>
      <text x="14" y="20" fill="#fbbf24" font-size="12" font-weight="600">Alpine Linux (3.19–3.21) &amp; Void Linux (musl)</text>
      <text x="330" y="20" fill="#9ca3af" font-size="11.5">linux-x64/arm64 (musl libc)</text>
      <text x="470" y="20" fill="#ef4444" font-size="12" font-weight="700" text-anchor="middle">9 / 36 (25%)</text>
      <text x="630" y="20" fill="#10b981" font-size="12" font-weight="700" text-anchor="middle">34 / 36 (94%)</text>
      <text x="795" y="20" fill="#34d399" font-size="11" text-anchor="middle">Bundled glibc loader in sysroot/</text>
    </g>

    <!-- Row 12: NixOS & Immutable Distros -->
    <g transform="translate(0, 314)">
      <rect x="0" y="0" width="920" height="30" rx="4" fill="#111827" stroke="#1f2937"/>
      <text x="14" y="20" fill="#fbbf24" font-size="12" font-weight="600">NixOS &amp; Distro Immutabili (Silverblue, SteamOS, MicroOS)</text>
      <text x="330" y="20" fill="#9ca3af" font-size="11.5">Non-FHS (/nix/store)</text>
      <text x="470" y="20" fill="#ef4444" font-size="12" font-weight="700" text-anchor="middle">9 / 36 (senza nix-ld)</text>
      <text x="630" y="20" fill="#10b981" font-size="12" font-weight="700" text-anchor="middle">35 / 36 (97%)</text>
      <text x="795" y="20" fill="#34d399" font-size="11" text-anchor="middle">ELF PT_INTERP relativo / wrapper</text>
    </g>
  </g>
</svg>
