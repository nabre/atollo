      <rect x="228" y="0" width="576" height="18" rx="4" fill="#10b981"/>
      <rect x="804" y="0" width="24" height="18" rx="2" fill="#f59e0b"/>
      <text x="836" y="13" fill="#10b981" font-weight="700">96%</text>
