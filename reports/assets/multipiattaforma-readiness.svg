    <g transform="translate(0, 366)">
      <text x="0" y="13" fill="#f8fafc" font-weight="600">12. Astrazioni Sistema (`tauri/src/os/**`)</text>
      <rect x="228" y="0" width="72" height="18" rx="4" fill="#10b981"/>
      <rect x="300" y="0" width="48" height="18" fill="#f59e0b"/>
      <rect x="348" y="0" width="480" height="18" rx="2" fill="#ef4444"/>
