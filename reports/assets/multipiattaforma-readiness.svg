      <rect x="348" y="0" width="60" height="18" fill="#f59e0b"/>
      <rect x="408" y="0" width="420" height="18" rx="2" fill="#ef4444"/>
      <text x="836" y="13" fill="#f87171" font-weight="700">20%</text>
