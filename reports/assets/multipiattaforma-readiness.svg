<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="920" height="540" rx="16" fill="url(#bg2)" stroke="#334155" stroke-width="1.5"/>

  <text x="32" y="40" fill="#f8fafc" font-size="20" font-weight="700">Analisi Readiness Multipiattaforma per Sottosistema (Windows vs macOS / Linux)</text>
  <text x="32" y="62" fill="#94a3b8" font-size="13">Percentuale di codice già pronto (Verde), da adattare/configurare (Giallo) e da riscrivere con astrazioni OS (Rosso)</text>

  <!-- Legend -->
  <g transform="translate(32, 82)" font-size="12">
    <rect x="0" y="-10" width="14" height="14" rx="3" fill="#10b981"/>
    <text x="20" y="1" fill="#e2e8f0" font-weight="600">Già Pronto Cross-Platform (57% globale)</text>

    <rect x="285" y="-10" width="14" height="14" rx="3" fill="#f59e0b"/>
    <text x="305" y="1" fill="#e2e8f0" font-weight="600">Da Adattare / Path &amp; Catalog (21% globale)</text>

    <rect x="595" y="-10" width="14" height="14" rx="3" fill="#ef4444"/>
    <text x="615" y="1" fill="#e2e8f0" font-weight="600">Win32 Hardcoded / Da Ristrutturare (22% globale)</text>
  </g>

