<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="100%" height="100%" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="960" height="470" rx="16" fill="url(#bg3)" stroke="#334155" stroke-width="1.5"/>

  <!-- Left Half: Bug Evolution v1 -> v2 -->
  <g transform="translate(32, 36)">
    <text x="0" y="0" fill="#f8fafc" font-size="18" font-weight="700">Stato Bug &amp; Anomalie: Confronto v1 → v2 (23 Totali: 1 Risolto, 22 Aperti)</text>
    <text x="0" y="22" fill="#94a3b8" font-size="12">Risolto BUG-02 (concorrenza write_atomic) + 3 nuovi finding nel codice multi-OS (BUG-22..24)</text>

    <!-- Card 1: Critici / Alta Priorità (da 5 a 4 aperti) -->
    <g transform="translate(0, 42)">
      <rect width="430" height="82" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
      <rect x="14" y="18" width="48" height="46" rx="8" fill="#ef4444" fill-opacity="0.18"/>
      <text x="38" y="48" text-anchor="middle" fill="#ef4444" font-size="21" font-weight="800">4<tspan font-size="12" fill="#10b981">/5</tspan></text>
      <text x="76" y="28" fill="#f8fafc" font-size="13.5" font-weight="700">Severità Alta: 4 Aperti | 1 RISOLTO in v2 (BUG-02)</text>
      <text x="76" y="47" fill="#10b981" font-size="11.5" font-weight="600">✓ BUG-02 RISOLTO: `fsx::write_atomic` usa ora AtomicU64 (`TMP_SEQ`)</text>
      <text x="76" y="65" fill="#94a3b8" font-size="11.5">• Aperti: BUG-01 (`serve.rs`), BUG-03/04 (`servers`), BUG-05 (`php-cgi`)</text>
    </g>

    <!-- Card 2: Media Priorità (9 da v1 + 2 nuovi multi-OS = 11) -->
    <g transform="translate(0, 136)">
      <rect width="430" height="82" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <rect x="14" y="18" width="48" height="46" rx="8" fill="#f59e0b" fill-opacity="0.18"/>
      <text x="38" y="48" text-anchor="middle" fill="#f59e0b" font-size="21" font-weight="800">11</text>
      <text x="76" y="28" fill="#f8fafc" font-size="13.5" font-weight="700">Severità Media: 9 Aperti da v1 + 2 Nuovi Multi-OS (BUG-22, 23)</text>
      <text x="76" y="47" fill="#fbbf24" font-size="11.5">• NUOVO BUG-22: `extract_tar_xz` chiama `tar -xJf` senza `safe_join` pre-check</text>
      <text x="76" y="65" fill="#fbbf24" font-size="11.5">• NUOVO BUG-23: `Git` Unix usa `Kind::Zip` su `.tar.bz2`; `Nginx` scarica sorgenti C</text>
    </g>

    <!-- Card 3: Bassa Priorità / Polish (7 da v1 + 1 nuovo multi-OS = 8) -->
    <g transform="translate(0, 230)">
      <rect width="430" height="82" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <rect x="14" y="18" width="48" height="46" rx="8" fill="#38bdf8" fill-opacity="0.18"/>
      <text x="38" y="48" text-anchor="middle" fill="#38bdf8" font-size="21" font-weight="800">8</text>
      <text x="76" y="28" fill="#f8fafc" font-size="13.5" font-weight="700">Severità Bassa: 7 Aperti da v1 + 1 Nuovo Multi-OS (BUG-24)</text>
      <text x="76" y="47" fill="#38bdf8" font-size="11.5">• NUOVO BUG-24: `Php`/`Apache` Unix puntano a URL Win; `Python` minor mismatch</text>
      <text x="76" y="65" fill="#94a3b8" font-size="11.5">• Aperti v1: BUG-15..21 (path guida/UI D-89, focus trap, `capitalize` CSS)</text>
    </g>

    <!-- Summary bar -->
    <g transform="translate(0, 330)">
      <text x="0" y="14" fill="#cbd5e1" font-size="12" font-weight="600">Salute Test Automatici v2:</text>
      <rect x="165" y="2" width="265" height="14" rx="4" fill="#10b981"/>
      <text x="165" y="32" fill="#10b981" font-size="11.5" font-weight="600">✓ +221 nuove righe di test Rust in `test/rust/` (kit, env, catalog, db, fsx, archive)</text>
    </g>
  </g>

  <!-- Right Half: User Facilitation & Multi-Host Coexistence Index -->
  <g transform="translate(492, 36)">
    <text x="0" y="0" fill="#f8fafc" font-size="18" font-weight="700">Facilitazione Utente &amp; Coabitazione Multi-OS (v2)</text>
    <text x="0" y="22" fill="#94a3b8" font-size="12">Impatto delle novità v2 sull'esperienza dello sviluppatore</text>

    <g transform="translate(0, 42)">
      <rect width="436" height="338" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>

      <!-- Metric 1 -->
      <g transform="translate(20, 28)">
        <text x="0" y="0" fill="#f8fafc" font-size="13" font-weight="700">1. Time-to-Code Setup Iniziale (Invariato — Eccellente)</text>
        <text x="0" y="18" fill="#94a3b8" font-size="11">Da ~95 min (manuale) a ~4 min (Wizard + Framework + HTTPS + DB + VSCodium)</text>
        <rect x="0" y="26" width="360" height="10" rx="5" fill="#475569"/>
        <rect x="0" y="42" width="36" height="10" rx="5" fill="#10b981"/>
        <text x="44" y="51" fill="#10b981" font-size="11" font-weight="700">-95% Tempo Setup (96 / 100)</text>
      </g>

      <!-- Metric 2 -->
      <g transform="translate(20, 108)">
        <text x="0" y="0" fill="#f8fafc" font-size="13" font-weight="700">2. Coabitazione Chiavetta USB tra Windows, Mac e Linux (NUOVO v2)</text>
        <text x="0" y="18" fill="#94a3b8" font-size="11">`data/apps/&lt;target&gt;`, `versions/&lt;target&gt;` e `root-&lt;os&gt;.txt` isolati senza conflitti</text>
        <rect x="0" y="26" width="396" height="12" rx="6" fill="#0f172a"/>
        <rect x="0" y="26" width="388" height="12" rx="6" fill="#10b981"/>
        <text x="396" y="0" text-anchor="end" fill="#10b981" font-size="13" font-weight="700">98 / 100 (+18)</text>
      </g>

      <!-- Metric 3 -->
      <g transform="translate(20, 174)">
        <text x="0" y="0" fill="#f8fafc" font-size="13" font-weight="700">3. Supporto Nativo Apple Silicon (`darwin-arm64`) &amp; `linux-arm64`</text>
        <text x="0" y="18" fill="#94a3b8" font-size="11">R, Julia, TinyTeX, Node, Python, Go, Java, Rust, .NET, Claude/Codex/Agy nativi</text>
        <rect x="0" y="26" width="396" height="12" rx="6" fill="#0f172a"/>
        <rect x="0" y="26" width="356" height="12" rx="6" fill="#38bdf8"/>
        <text x="396" y="0" text-anchor="end" fill="#38bdf8" font-size="13" font-weight="700">90 / 100 (+60)</text>
      </g>

      <!-- Metric 4 -->
      <g transform="translate(20, 240)">
        <text x="0" y="0" fill="#f8fafc" font-size="13" font-weight="700">4. Orchestrazione Multi-Agente IA &amp; Sync Bidirezionale</text>
        <text x="0" y="18" fill="#94a3b8" font-size="11">Rilocazione venv Python estesa anche a layout Unix (`bin/`, `lib/python*/site-packages`)</text>
        <rect x="0" y="26" width="396" height="12" rx="6" fill="#0f172a"/>
        <rect x="0" y="26" width="364" height="12" rx="6" fill="#818cf8"/>
        <text x="396" y="0" text-anchor="end" fill="#818cf8" font-size="13" font-weight="700">92 / 100 (+2)</text>
      </g>
    </g>
  </g>
</svg>
