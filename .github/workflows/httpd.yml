name: Apache httpd

# The kit's relocatable Apache httpd for macOS and Linux (DECISIONS.md
# D-116), built by scripts/build-httpd from the sources pinned in
# sources.txt. Pull requests that touch the build only build and test it;
# a tag httpd-v<version>-<build> (httpd-v2.4.69-1) also publishes the three
# tarballs and their .sha256 files as a GitHub release, whose asset digests
# the catalog pins (sha256ByTarget of components.json).
on:
  push:
    tags: ['httpd-v*']
  pull_request:
    paths:
      - scripts/build-httpd/**
      - .github/workflows/httpd.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: httpd-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: httpd ${{ matrix.target }}
    # Native runners only: build.sh refuses a host of another architecture.
    runs-on: ${{ fromJSON('{"linux-x64":"ubuntu-24.04","linux-arm64":"ubuntu-24.04-arm","darwin-arm64":"macos-latest"}')[matrix.target] }}
    # Linux in ubuntu:22.04 for its glibc 2.35 floor, as bundle-linux of
    # app.yml; GitHub cannot set a container for some matrix entries only,
    # so the macOS jobs ignore an empty image.
    container: ${{ startsWith(matrix.target, 'linux') && 'ubuntu:22.04' || '' }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # Without ARM64 runners (ARM64_RUNNERS=off) linux-arm64 is left out,
        # as in app.yml. A release needs all three (D-176).
        target: ${{ fromJSON(vars.ARM64_RUNNERS == 'off' && '["linux-x64","darwin-arm64"]' || '["linux-x64","linux-arm64","darwin-arm64"]') }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: System packages (Linux)
        if: startsWith(matrix.target, 'linux')
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential perl patchelf file xz-utils bzip2
      - uses: actions/checkout@v5
      # The build number comes from the tag on a release, 0 otherwise (a
      # test build never mistaken for a published one).
      - name: Build number
        id: num
        run: |
          build=0
          if [[ "$GITHUB_REF" == refs/tags/httpd-v* ]]; then
            tag=${GITHUB_REF#refs/tags/httpd-v}
            version=$(awk '$1 == "httpd" { print $2 }' scripts/build-httpd/sources.txt)
            [[ "$tag" =~ ^${version//./\\.}-([0-9]+)$ ]] || { echo "tag httpd-v$tag is not httpd-v$version-<build>" >&2; exit 1; }
            build=${BASH_REMATCH[1]}
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - name: Build
        run: bash scripts/build-httpd/build.sh ${{ matrix.target }} ${{ steps.num.outputs.build }} out
      - name: Test
        run: bash scripts/build-httpd/test.sh out/httpd-*-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@v6
        with:
          name: httpd-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/httpd-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: httpd-*
          path: artifacts
          merge-multiple: true
      - name: Three targets
        run: |
          ls -l artifacts
          for t in linux-x64 linux-arm64 darwin-arm64; do
            ls artifacts/httpd-*-"$t".tar.gz >/dev/null || { echo "no tarball for $t" >&2; exit 1; }
          done
          (cd artifacts && sha256sum -c *.sha256)
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$GITHUB_REF_NAME
          # Never the repository's latest release: that is the app's (app.yml).
          gh release create "$tag" artifacts/* --verify-tag --latest=false --title "Apache httpd ${tag#httpd-v}" \
            --notes "Relocatable Apache httpd for the kit on macOS (Apple Silicon) and Linux (x64, arm64), built by scripts/build-httpd from signed upstream sources (see BUILDINFO.txt in each tarball)."
