name: Site

# The landing page (site/) on GitHub Pages: https://nabre.github.io/atollo/.
# Built from site/ with the brand files and screenshots of docs/, deployed
# with actions/deploy-pages: no gh-pages branch (DECISIONS.md D-126).
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/brand/**'
      # The languages (site/build.mjs) and the screenshots helpers.
      - 'scripts/lib/**'
      # The tool matrix (site/matrix.mjs) follows the app's catalog.
      - 'tauri/catalog/components.json'
      - 'tauri/i18n/catalog.json'
      # The app's version, in the download names (site/build.mjs).
      - 'tauri/Cargo.toml'
      # The icons: react-icons, drawn into SVG at build time.
      - 'package-lock.json'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      # react, react-dom and react-icons (the ui workspace), for the icons.
      - name: Install the dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the site
        run: node site/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
