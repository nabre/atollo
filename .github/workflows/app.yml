name: App

on:
  push:
    # feature/platforms is the integration branch of the macOS and Linux
    # port (DECISIONS.md D-105, D-108 to D-115).
    branches: [main, feature/platforms]
    tags: ['app-v*']
  # Every base branch, feature/platforms too: the coordinator sees macOS
  # and Linux before each merge (docs/app/TESTING.md).
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  # A release run is never cancelled: each ref has its own group anyway.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Which jobs the change needs (D-134). Every changed file sets the levels
  # of the jobs that can see it break (the case list in Levels):
  #   bundle - packaging and startup: the macOS and Linux bundles and
  #            release smoke; includes kit;
  #   kit    - the Windows exes with prepare and the real_ tests on a real
  #            kit (install, net, editor, runtime, components.json);
  #            includes rust;
  #   rust   - cargo clippy and cargo test on every system;
  #   ui     - lint, Vitest, the guide documents and build on Windows,
  #            Vitest on Linux x64.
  # No level (docs, the site, generated schemas, the httpd and PHP builds,
  # which have their own workflows): no job but this one. A path the list
  # does not know, a tag, a manual run or a diff that cannot be read run
  # everything.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # The files of a pull request come from the API.
      pull-requests: read
    outputs:
      bundle: ${{ steps.levels.outputs.bundle }}
      kit: ${{ steps.levels.outputs.kit }}
      rust: ${{ steps.levels.outputs.rust }}
      ui: ${{ steps.levels.outputs.ui }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
      # Only the list of changed files: a push against the commit before it
      # on the same branch, a pull request against its base.
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        with:
          base: ${{ github.event_name == 'push' && github.ref_name || '' }}
          list-files: json
          filters: |
            changed:
              - '**'
      # The filter skipped (tag, manual run) or failed (a force push whose
      # previous commit is gone): everything, never less.
      #
      # Every file the binary embeds sits under a path below: the
      # include_str!/include_bytes! of tauri/src read tauri/catalog,
      # tauri/i18n, tauri/editor-theme, runtime/ and site/assets/fonts; the
      # tests read test/ and scripts/matrix; test/ui imports
      # components.json. The bundles start the app (--version, check: main,
      # cli, kit, env, settings, os, setup); the Windows build also runs
      # prepare (install, net, components.json) and the real_ tests (editor,
      # the pwsh profile of runtime/).
      - name: Levels
        id: levels
        shell: bash
        env:
          ALL: ${{ steps.filter.outcome != 'success' }}
          FILES: ${{ steps.filter.outputs.changed_files }}
        run: |
          ui=false rust=false kit=false bundle=false
          unknown=()
          everything() { ui=true bundle=true; }
          if [ "$ALL" = true ]; then
            everything
          else
            # An assignment, so a jq that fails stops the step (bash -e)
            # instead of reading no files and running nothing.
            files=$(jq -r '.[]' <<<"${FILES:-[]}")
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              case "$f" in
                # What every job builds on.
                Cargo.toml | Cargo.lock | package.json | package-lock.json | .gitattributes | .github/workflows/app.yml)
                  everything ;;
                # Packaging, and the code that starts the app.
                tauri/Cargo.toml | tauri/build.rs | tauri/tauri.conf.json | tauri/Info.plist | tauri/entitlements.plist | tauri/windows-app.manifest | tauri/icons/*)
                  bundle=true ;;
                tauri/src/main.rs | tauri/src/app.rs | tauri/src/cli.rs | tauri/src/kit/* | tauri/src/log.rs | tauri/src/env/* | tauri/src/settings.rs | tauri/src/fsx.rs | tauri/src/i18n.rs | tauri/src/os/* | tauri/src/setup/*)
                  bundle=true ;;
                # What prepare and the real_ tests use on a real kit.
                tauri/catalog/components.json)
                  kit=true ui=true ;;
                tauri/src/install/* | tauri/src/net/* | tauri/src/editor/* | runtime/*)
                  kit=true ;;
                # The rest of the app's code and data, and the Rust tests.
                tauri/src/* | tauri/catalog/* | tauri/i18n/* | tauri/editor-theme/* | tauri/capabilities/* | tauri/permissions/* | site/assets/fonts/* | test/rust/* | scripts/matrix/sources.json | scripts/test-linux.sh | rustfmt.toml)
                  rust=true ;;
                ui/* | test/ui/* | eslint.config.mjs | .prettierrc.json)
                  ui=true ;;
                # The Guide's content, drawn by the app (D-164), and the
                # check of its chunks.
                guide/* | scripts/guide-chunks.mjs)
                  ui=true ;;
                # VSCodium 1.135's rules, which test/ui/theme compares the
                # tokens with, and the script that extracts them (D-142).
                docs/brand/vscodium-1.135/* | scripts/vscodium-css/*)
                  ui=true ;;
                # Generated by the build, documents, the site, the builds of
                # httpd and PHP (their own workflows), local tools.
                tauri/gen/* | docs/* | site/* | *.md | LICENSE | .gitignore | .claude/* | scripts/build-httpd/* | scripts/build-php/* | scripts/cross-check/* | scripts/dev-ui.mjs | scripts/guide-shots/* | .github/workflows/httpd.yml | .github/workflows/php.yml | .github/workflows/site.yml)
                  ;;
                # A path this list does not know yet: everything.
                *)
                  everything
                  unknown+=("$f") ;;
              esac
            done <<<"$files"
          fi
          if [ "$bundle" = true ]; then kit=true; fi
          if [ "$kit" = true ]; then rust=true; fi
          printf 'bundle=%s\nkit=%s\nrust=%s\nui=%s\n' "$bundle" "$kit" "$rust" "$ui" | tee -a "$GITHUB_OUTPUT"
          {
            echo "### Jobs for this change"
            echo "| bundle | kit | rust | ui |"
            echo "| --- | --- | --- | --- |"
            echo "| $bundle | $kit | $rust | $ui |"
            if [ "${#unknown[@]}" -gt 0 ]; then
              echo
              echo "Not in the list of app.yml, so everything ran:"
              printf -- '- `%s`\n' "${unknown[@]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  check:
    name: Lint and test
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ui == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.rust == 'true'
      - name: Frontend dependencies
        run: npm ci --no-fund --no-audit
      # One step per command: a multi-line pwsh step only fails on the last
      # command's exit code.
      - name: Frontend lint and types
        if: needs.changes.outputs.ui == 'true'
        run: npm -w ui run lint
      - name: Frontend format
        if: needs.changes.outputs.ui == 'true'
        run: npm -w ui run format:check
      - name: Frontend tests
        if: needs.changes.outputs.ui == 'true'
        run: npm -w ui test
      # Also for cargo: tauri::generate_context! needs the frontend in dist/.
      - name: Frontend build
        run: npm -w ui run build
      # A chunk pattern of vite.config.ts that stops matching fails nothing
      # by itself (GUI-V7-08): one chunk per chapter of the Guide.
      - name: Guide chunks
        if: needs.changes.outputs.ui == 'true'
        run: node scripts/guide-chunks.mjs
      # Always: it takes seconds and needs no build.
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --all-targets -- -D warnings
      # Still in pwsh, as before; stdout (where the results are) is kept for
      # the counts in the job's summary, and the step ends with cargo's
      # $LASTEXITCODE.
      - name: cargo test
        if: needs.changes.outputs.rust == 'true'
        run: cargo test | Tee-Object -FilePath cargo-test.log
      - name: Test summary
        if: always() && needs.changes.outputs.rust == 'true'
        shell: bash
        run: |
          {
            echo "### cargo test (win32-x64)"
            if grep -q '^test result:' cargo-test.log 2>/dev/null; then
              grep '^test result:' cargo-test.log | awk '{ p += $4; f += $6; i += $8 } END { printf "| passed | failed | ignored |\n| ---: | ---: | ---: |\n| %d | %d | %d |\n", p, f, i }'
              grep -E '^test .* \.\.\. FAILED$' cargo-test.log | sed 's/^/- /' || true
            else
              echo "No test result: the tests did not build or run (see the log)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # cargo test on macOS and Linux (docs/app/TESTING.md). Tests that only hold on Windows
  # (Windows paths, cmd.exe, junctions) carry
  # #[cfg_attr(not(windows), ignore = "...")] and count as ignored here.
  # tauri 2.12.1 builds its `test` feature on macOS too (2.12.0 did not:
  # MockRuntime without `transparent`), so every job runs the whole suite.
  # An interface-only change (level ui) runs Vitest on linux-x64 alone.
  test-unix:
    name: Test ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ui == 'true'
    # The runner comes from the target, so `target` is the only matrix key.
    # macos-13 is retired; macos-15-intel is the last x64 macOS image.
    # Linux pinned to 24.04 (the WSL2 Ubuntu of scripts/test-linux.sh), not
    # ubuntu-latest: the package names of Tauri's system libraries below are
    # those of 24.04, and ubuntu-latest moves to a newer release by itself.
    runs-on: ${{ fromJSON('{"linux-x64":"ubuntu-24.04","linux-arm64":"ubuntu-24.04-arm","darwin-arm64":"macos-latest","darwin-x64":"macos-15-intel"}')[matrix.target] }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # A repository without ARM64 runners (a private one may have none)
        # sets the variable ARM64_RUNNERS to off: linux-arm64 is left out of
        # the list instead of waiting for a runner that never comes. Not an
        # exclude plus include: GitHub applies include after exclude and
        # would add the excluded target back as a new combination.
        target: ${{ fromJSON(needs.changes.outputs.rust != 'true' && '["linux-x64"]' || vars.ARM64_RUNNERS == 'off' && '["linux-x64","darwin-arm64","darwin-x64"]' || '["linux-x64","linux-arm64","darwin-arm64","darwin-x64"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.rust == 'true'
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.rust == 'true'
        with:
          key: ${{ matrix.target }}
      - name: System libraries of Tauri 2 (Linux)
        if: runner.os == 'Linux' && needs.changes.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf libssl-dev libdbus-1-dev libxdo-dev pkg-config build-essential
      # tauri::generate_context! needs the frontend in dist/.
      - name: Frontend dependencies
        run: npm ci --no-fund --no-audit
      - name: Frontend build
        if: needs.changes.outputs.rust == 'true'
        run: npm -w ui run build
      # Vitest once off Windows (paths, line endings): the x64 Linux job.
      - name: Frontend tests
        if: matrix.target == 'linux-x64' && needs.changes.outputs.ui == 'true'
        run: npm -w ui test
      # scripts/test-linux.sh copies with rsync --delete: only into an empty
      # folder or one it made (marker), never into a clone with its own work.
      - name: test-linux.sh copy guard
        if: matrix.target == 'linux-x64' && needs.changes.outputs.rust == 'true'
        shell: bash
        run: |
          t="$RUNNER_TEMP/guard"
          mkdir -p "$t/empty" "$t/copy" "$t/clone/.git" "$t/clone/tauri" "$t/other"
          touch "$t/copy/.atollo-linux-copy" "$t/clone/Cargo.toml" "$t/other/x"
          check() {
            local got=0
            ATOLLO_LINUX_DIR="$t/$1" bash scripts/test-linux.sh --check-dest >/dev/null 2>&1 || got=$?
            echo "$1: exit $got (want $2)"
            [ "$got" -eq "$2" ]
          }
          check empty 0 && check absent 0 && check copy 0 && check clone 2 && check other 2
      - name: cargo clippy
        if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --all-targets -- -D warnings
      # The output is kept for the summary; pipefail keeps cargo's exit code
      # through tee.
      - name: cargo test
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        run: |
          set -o pipefail
          cargo test 2>&1 | tee cargo-test.log
      - name: Test summary
        if: always() && needs.changes.outputs.rust == 'true'
        shell: bash
        run: |
          {
            echo "### cargo test (${{ matrix.target }})"
            if grep -q '^test result:' cargo-test.log 2>/dev/null; then
              grep '^test result:' cargo-test.log | awk '{ p += $4; f += $6; i += $8 } END { printf "| passed | failed | ignored |\n| ---: | ---: | ---: |\n| %d | %d | %d |\n", p, f, i }'
              grep -E '^test .* \.\.\. FAILED$' cargo-test.log | sed 's/^/- /' || true
            else
              echo "No test result: the tests did not build or run (see the log)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # cargo test natively on Windows ARM64: the build job only cross-compiles
  # aarch64-pc-windows-msvc on x64. Left out with ARM64_RUNNERS=off.
  test-windows-arm64:
    name: Test win32-arm64
    runs-on: windows-11-arm
    needs: changes
    if: needs.changes.outputs.rust == 'true' && vars.ARM64_RUNNERS != 'off'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json
      # The native toolchain by name: an x64 rustup (preinstalled, or
      # rustup-init run under emulation) would otherwise pick an x64 host
      # and test an emulated build.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable-aarch64-pc-windows-msvc
      # No silent fallback to emulation: the job fails unless rustc is native.
      - name: Native aarch64 toolchain
        shell: bash
        run: |
          rustc -vV
          rustc -vV | tr -d '\r' | grep -qx 'host: aarch64-pc-windows-msvc' || { echo "rustc is not aarch64-pc-windows-msvc: the tests would run under emulation" >&2; exit 1; }
      - uses: Swatinem/rust-cache@v2
      - name: Frontend dependencies
        run: npm ci --no-fund --no-audit
      - name: Frontend build
        run: npm -w ui run build
      # pwsh, as in the x64 job.
      - name: cargo test
        run: cargo test | Tee-Object -FilePath cargo-test.log
      - name: Test summary
        if: always()
        shell: bash
        run: |
          {
            echo "### cargo test (win32-arm64)"
            if grep -q '^test result:' cargo-test.log 2>/dev/null; then
              grep '^test result:' cargo-test.log | awk '{ p += $4; f += $6; i += $8 } END { printf "| passed | failed | ignored |\n| ---: | ---: | ---: |\n| %d | %d | %d |\n", p, f, i }'
              grep -E '^test .* \.\.\. FAILED$' cargo-test.log | sed 's/^/- /' || true
            else
              echo "No test result: the tests did not build or run (see the log)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Atollo.app for macOS (D-113: ad hoc, no Developer ID), one
  # native build per architecture, ad hoc signed under the hardened runtime
  # with tauri/entitlements.plist, zipped as the self-updater reads it
  # (Atollo-<version>-<target>.app.zip, setup/self_update.rs). The artifact
  # bundle-<target> is what the release job publishes, after release-smoke
  # has started it again (D-113, D-119).
  bundle-macos:
    name: Bundle ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.bundle == 'true'
    runs-on: ${{ matrix.target == 'darwin-x64' && 'macos-15-intel' || 'macos-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [darwin-arm64, darwin-x64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle-${{ matrix.target }}
      - name: Frontend dependencies
        run: npm ci --no-fund --no-audit
      # The release names carry the version of tauri/Cargo.toml.
      - name: App version
        run: echo "VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' tauri/Cargo.toml | head -n 1)" >> "$GITHUB_ENV"
      # bundle.macOS of tauri.conf.json: minimumSystemVersion 12.0 (also
      # MACOSX_DEPLOYMENT_TARGET of the build), signingIdentity "-".
      - name: Build (Atollo.app)
        run: ./node_modules/.bin/tauri build --bundles app
      # Signed again explicitly, so the signature never depends on how the
      # bundler reads the identity: ad hoc (-), hardened runtime, the
      # entitlements of the repository, no timestamp (none for ad hoc).
      - name: Ad hoc signature
        run: |
          app=target/release/bundle/macos/Atollo.app
          codesign --force --sign - --options runtime --timestamp=none --entitlements tauri/entitlements.plist "$app"
          codesign --verify --strict --verbose=2 "$app"
          info=$(codesign -dv --verbose=4 "$app" 2>&1)
          echo "$info"
          grep -q '^Signature=adhoc$' <<<"$info" || { echo "not ad hoc signed" >&2; exit 1; }
          grep -Eq '^CodeDirectory .*flags=0x[0-9a-f]+\(adhoc,runtime\)' <<<"$info" || { echo "no hardened runtime" >&2; exit 1; }
          ents=$(codesign -d --entitlements - --xml "$app" 2>/dev/null)
          for key in com.apple.security.cs.allow-jit com.apple.security.cs.disable-library-validation; do
            grep -q "$key" <<<"$ents" || { echo "entitlement $key missing" >&2; exit 1; }
          done
      - name: Info.plist and minimum macOS
        run: |
          app=target/release/bundle/macos/Atollo.app
          plist="$app/Contents/Info.plist"
          want() {
            local got
            got=$(plutil -extract "$1" raw -o - "$plist")
            echo "$1 = $got"
            [ "$got" = "$2" ] || { echo "$1: want $2" >&2; exit 1; }
          }
          want CFBundleIdentifier io.github.nabre.atollo
          want CFBundleName Atollo
          want CFBundleExecutable Atollo
          want LSMinimumSystemVersion 12.0
          minos=$(otool -l "$app/Contents/MacOS/Atollo" | awk '/LC_BUILD_VERSION/ { b = 1 } b && $1 == "minos" { print $2; exit }')
          echo "minos = $minos"
          [ "$minos" = "12.0" ] || { echo "the binary targets macOS $minos, not 12.0" >&2; exit 1; }
          lipo -archs "$app/Contents/MacOS/Atollo"
          want_arch=${{ matrix.target == 'darwin-x64' && 'x86_64' || 'arm64' }}
          [ "$(lipo -archs "$app/Contents/MacOS/Atollo")" = "$want_arch" ] || { echo "not a $want_arch binary" >&2; exit 1; }
      # ditto keeps the modes and the signature; no resource forks or
      # extended attributes (__MACOSX), which the updater does not read.
      - name: Zip
        run: |
          mkdir -p out
          ditto -c -k --norsrc --noextattr --noacl --keepParent target/release/bundle/macos/Atollo.app "out/Atollo-$VERSION-${{ matrix.target }}.app.zip"
          (cd out && shasum -a 256 "Atollo-$VERSION-${{ matrix.target }}.app.zip" | tee "Atollo-$VERSION-${{ matrix.target }}.app.zip.sha256")
      # From the zip, as a user (and the updater) gets it, in a new kit
      # folder with a space and a parenthesis in its path.
      - name: Smoke test
        run: |
          kit="$RUNNER_TEMP/kit (1)"
          mkdir -p "$kit"
          ditto -x -k "out/Atollo-$VERSION-${{ matrix.target }}.app.zip" "$kit"
          codesign --verify --strict "$kit/Atollo.app"
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' tauri/Cargo.toml | head -n 1)
          out=$("$kit/Atollo.app/Contents/MacOS/Atollo" --version)
          echo "$out"
          grep -q " $version\$" <<<"$out" || { echo "--version: want $version" >&2; exit 1; }
          # Nothing is ever written inside the bundle (its signature).
          codesign --verify --strict "$kit/Atollo.app"
      - uses: actions/upload-artifact@v6
        with:
          name: bundle-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  # The AppImage and the tar.gz for Linux (D-113), built on Ubuntu 22.04
  # for its glibc 2.35 floor. Tauri's AppImage bundler runs linuxdeploy with
  # its GTK plugin, so WebKitGTK and GTK travel inside the image; the
  # tar.gz holds only the binary, for systems without FUSE that have
  # WebKitGTK 4.1 installed. Published by the release job, as for macOS.
  #
  # 22.04 is a container on the 24.04 runners: GitHub retires its
  # ubuntu-22.04 images (actions/runner-images#14254, gone on 2027-04-17),
  # while the floor comes from the system the binary links against, not
  # from the runner.
  bundle-linux:
    name: Bundle ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.bundle == 'true'
    runs-on: ${{ matrix.target == 'linux-arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: ubuntu:22.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # Without ARM64 runners (ARM64_RUNNERS=off) linux-arm64 is left out,
        # as in test-unix.
        target: ${{ fromJSON(vars.ARM64_RUNNERS == 'off' && '["linux-x64"]' || '["linux-x64","linux-arm64"]') }}
    env:
      # linuxdeploy is itself an AppImage: it runs without FUSE (none in a
      # container either).
      APPIMAGE_EXTRACT_AND_RUN: 1
      DEBIAN_FRONTEND: noninteractive
    steps:
      # Before checkout (a real clone needs git) and the toolchain (rustup
      # comes through curl). The libraries of Tauri 2 (22.04 names), file
      # and xdg-utils for the AppImage bundler, xvfb and xauth for the
      # smoke test. Root in the container: no sudo.
      - name: System packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential file xdg-utils xvfb xauth libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf libssl-dev libdbus-1-dev libxdo-dev pkg-config
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle-${{ matrix.target }}
      - name: Frontend dependencies
        run: npm ci --no-fund --no-audit
      # The release names carry the version of tauri/Cargo.toml.
      - name: App version
        run: echo "VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' tauri/Cargo.toml | head -n 1)" >> "$GITHUB_ENV"
      - name: Build (AppImage)
        run: ./node_modules/.bin/tauri build --bundles appimage
      # The newest glibc symbol the binary needs: never above the build
      # system's 2.35, so the app starts on Ubuntu 22.04, Debian 12 and later.
      - name: glibc floor
        run: |
          floor=$(objdump -T target/release/Atollo | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)
          echo "needs $floor"
          [ "$(printf '%s\n' "$floor" GLIBC_2.35 | sort -V | tail -n 1)" = GLIBC_2.35 ] || { echo "$floor is above GLIBC_2.35" >&2; exit 1; }
      - name: Package
        run: |
          mkdir -p out
          images=(target/release/bundle/appimage/*.AppImage)
          [ "${#images[@]}" -eq 1 ] && [ -f "${images[0]}" ] || { echo "want one AppImage: ${images[*]}" >&2; exit 1; }
          cp "${images[0]}" "out/Atollo-$VERSION-${{ matrix.target }}.AppImage"
          chmod 755 "out/Atollo-$VERSION-${{ matrix.target }}.AppImage"
          tar -czf "out/Atollo-$VERSION-${{ matrix.target }}.tar.gz" -C target/release Atollo
          (cd out && for f in *; do sha256sum "$f" | tee "$f.sha256"; done)
      # In new kit folders with a space and a parenthesis: --version, then
      # check under a virtual display. The AppImage runs with
      # --appimage-extract-and-run (the hint for systems without FUSE); its
      # kit is the AppImage's folder, never the temporary extraction.
      - name: Smoke test
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' tauri/Cargo.toml | head -n 1)
          smoke() {
            local kit="$1"; shift
            local out code=0
            out=$(cd "$kit" && "$@" --version)
            echo "$out"
            grep -q " $version\$" <<<"$out" || { echo "--version: want $version" >&2; exit 1; }
            (cd "$kit" && xvfb-run -a "$@" check) || code=$?
            # 0 every check passed, 1 something missing in an empty kit; a
            # crash or a signal is above that.
            [ "$code" -le 1 ] || { echo "check failed with $code" >&2; exit 1; }
            [ -d "$kit/data" ] && [ -d "$kit/projects" ] || { echo "no kit next to the app in $kit" >&2; ls -la "$kit"; exit 1; }
          }
          image="$RUNNER_TEMP/image (1)"
          mkdir -p "$image"
          cp "out/Atollo-$VERSION-${{ matrix.target }}.AppImage" "$image/Atollo.AppImage"
          smoke "$image" ./Atollo.AppImage --appimage-extract-and-run
          plain="$RUNNER_TEMP/plain (1)"
          mkdir -p "$plain"
          tar -xzf "out/Atollo-$VERSION-${{ matrix.target }}.tar.gz" -C "$plain"
          smoke "$plain" ./Atollo
      - uses: actions/upload-artifact@v6
        with:
          name: bundle-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  # The release inputs themselves, started again (D-119): the artifact
  # bundle-<target> downloaded as the release job gets it, checked against
  # its .sha256, then started the way the README says, on a plain runner
  # (not the build container): macOS after `xattr -dr com.apple.quarantine`,
  # the AppImage with --appimage-extract-and-run under its release name, the
  # tar.gz with WebKitGTK 4.1 from the system. Every run that builds the
  # bundles, not only on tags, so a release never publishes something that
  # was not started here; skipped with them below level bundle.
  release-smoke:
    name: Release smoke ${{ matrix.target }}
    needs: [bundle-macos, bundle-linux]
    runs-on: ${{ fromJSON('{"linux-x64":"ubuntu-24.04","linux-arm64":"ubuntu-24.04-arm","darwin-arm64":"macos-latest","darwin-x64":"macos-15-intel"}')[matrix.target] }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # As in test-unix: linux-arm64 only with ARM64 runners.
        target: ${{ fromJSON(vars.ARM64_RUNNERS == 'off' && '["linux-x64","darwin-arm64","darwin-x64"]' || '["linux-x64","linux-arm64","darwin-arm64","darwin-x64"]') }}
    steps:
      # Only for the version in tauri/Cargo.toml; nothing is built here.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: tauri/Cargo.toml
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v7
        with:
          name: bundle-${{ matrix.target }}
          path: assets
      - name: App version
        run: echo "VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' tauri/Cargo.toml | head -n 1)" >> "$GITHUB_ENV"
      # The names the release publishes and the updater looks for
      # (setup/self_update.rs, asset_name), each with its .sha256.
      - name: Names and checksums
        run: |
          case "${{ matrix.target }}" in
            darwin-*) want="Atollo-$VERSION-${{ matrix.target }}.app.zip" ;;
            *) want="Atollo-$VERSION-${{ matrix.target }}.AppImage Atollo-$VERSION-${{ matrix.target }}.tar.gz" ;;
          esac
          cd assets
          ls -la
          for f in $want; do
            [ -f "$f" ] && [ -f "$f.sha256" ] || { echo "missing $f or $f.sha256" >&2; exit 1; }
            want_hash=$(awk '{ print $1; exit }' "$f.sha256")
            got_hash=$( (command -v sha256sum >/dev/null && sha256sum "$f" || shasum -a 256 "$f") | awk '{ print $1 }')
            [ "$want_hash" = "$got_hash" ] || { echo "$f: SHA-256 $got_hash, its .sha256 says $want_hash" >&2; exit 1; }
            echo "$f $got_hash"
          done
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' tauri/Cargo.toml | head -n 1)
          kit="$RUNNER_TEMP/release kit (1)"
          mkdir -p "$kit"
          ditto -x -k "assets/Atollo-$VERSION-${{ matrix.target }}.app.zip" "$kit"
          app="$kit/Atollo.app"
          # As a browser download: quarantined. Then the README's command.
          xattr -w com.apple.quarantine "0083;$(printf %x "$(date +%s)");Safari;" "$app"
          xattr -dr com.apple.quarantine "$app"
          if xattr -lr "$app" | grep -q com.apple.quarantine; then echo "quarantine still set" >&2; exit 1; fi
          codesign --verify --strict --verbose=2 "$app"
          out=$("$app/Contents/MacOS/Atollo" --version)
          echo "$out"
          grep -q " $version\$" <<<"$out" || { echo "--version: want $version" >&2; exit 1; }
          code=0
          (cd "$kit" && "$app/Contents/MacOS/Atollo" check) || code=$?
          # 0 every check passed, 1 something missing in an empty kit.
          [ "$code" -le 1 ] || { echo "check failed with $code" >&2; exit 1; }
          [ -d "$kit/data" ] && [ -d "$kit/projects" ] || { echo "no kit next to Atollo.app" >&2; ls -la "$kit"; exit 1; }
          # Nothing written inside the bundle (its signature).
          codesign --verify --strict "$app"
      # Only the runtime the README names for the tar.gz (no -dev packages),
      # so the ldd check below holds the README to it; xvfb and xauth for
      # the virtual display. The AppImage carries its own libraries.
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libwebkit2gtk-4.1-0
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' tauri/Cargo.toml | head -n 1)
          smoke() {
            local kit="$1"; shift
            local out code=0
            out=$(cd "$kit" && "$@" --version)
            echo "$out"
            grep -q " $version\$" <<<"$out" || { echo "--version: want $version" >&2; exit 1; }
            (cd "$kit" && xvfb-run -a "$@" check) || code=$?
            [ "$code" -le 1 ] || { echo "check failed with $code" >&2; exit 1; }
            [ -d "$kit/data" ] && [ -d "$kit/projects" ] || { echo "no kit next to the app in $kit" >&2; ls -la "$kit"; exit 1; }
          }
          name="Atollo-$VERSION-${{ matrix.target }}.AppImage"
          image="$RUNNER_TEMP/release image (1)"
          mkdir -p "$image"
          cp "assets/$name" "$image/"
          # Artifacts lose the mode: the user's chmod +x, as in the README.
          chmod +x "$image/$name"
          smoke "$image" "./$name" --appimage-extract-and-run
          plain="$RUNNER_TEMP/release plain (1)"
          mkdir -p "$plain"
          tar -xzf "assets/Atollo-$VERSION-${{ matrix.target }}.tar.gz" -C "$plain"
          [ -x "$plain/Atollo" ] || { echo "Atollo in the tar.gz is not executable" >&2; exit 1; }
          if ldd "$plain/Atollo" | grep 'not found'; then echo "the tar.gz needs libraries the README does not name" >&2; exit 1; fi
          smoke "$plain" ./Atollo

  build:
    name: Build ${{ matrix.target }}
    needs: [changes, check]
    if: needs.changes.outputs.kit == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Frontend dependencies
        run: npm ci --no-fund --no-audit
      - name: Build (no installer)
        run: ./node_modules/.bin/tauri build --no-bundle --target ${{ matrix.target }}
      - name: No elevation in the manifest
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/Atollo.exe"
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          if ($text -notmatch 'requestedExecutionLevel level="asInvoker"') { throw "asInvoker missing" }
          if ($text -match 'requireAdministrator|highestAvailable') { throw "elevation requested" }
      - name: PE VersionInfo metadata
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/Atollo.exe"
          $vi = (Get-Item $exe).VersionInfo
          $vi | Format-List ProductName, FileDescription, CompanyName, OriginalFilename, InternalName, FileVersion, ProductVersion
          if ($vi.ProductName -ne 'Atollo') { throw "unexpected ProductName: '$($vi.ProductName)'" }
          if ($vi.FileDescription -ne 'Atollo — Universal Portable Dev & AI Workspace') { throw "unexpected FileDescription: '$($vi.FileDescription)'" }
          if ($vi.CompanyName -ne 'nabre') { throw "unexpected CompanyName: '$($vi.CompanyName)'" }
          if ($vi.OriginalFilename -ne 'Atollo.exe') { throw "unexpected OriginalFilename: '$($vi.OriginalFilename)'" }
          if (-not $vi.FileVersion) { throw "FileVersion missing" }
      - name: Check signing configuration
        id: sign-config
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $signpath = [bool]($env:SIGNPATH_API_TOKEN -and $env:SIGNPATH_ORGANIZATION_ID -and $env:SIGNPATH_PROJECT_SLUG -and $env:SIGNPATH_SIGNING_POLICY_SLUG)
          "signpath=$($signpath.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Upload unsigned artifact for SignPath
        id: upload-unsigned
        if: steps.sign-config.outputs.signpath == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: unsigned-Atollo-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/Atollo.exe
          if-no-files-found: error
      - name: Submit signing request to SignPath
        if: steps.sign-config.outputs.signpath == 'true'
        # Pinned to the commit of tag v1 (it receives the signing token).
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: target/${{ matrix.target }}/signed
      - name: Replace exe with SignPath signed artifact
        if: steps.sign-config.outputs.signpath == 'true'
        shell: pwsh
        run: |
          $signed = "target/${{ matrix.target }}/signed/Atollo.exe"
          $dest = "target/${{ matrix.target }}/release/Atollo.exe"
          if (-not (Test-Path $signed)) { throw "Signed binary not found at $signed" }
          Copy-Item $signed $dest -Force
          $sig = Get-AuthenticodeSignature $dest
          if ($sig.Status -ne 'Valid') { throw "Authenticode signature invalid: $($sig.Status) ($($sig.StatusMessage))" }
      - name: Sign the exe with local PFX (optional fallback)
        if: steps.sign-config.outputs.signpath != 'true'
        shell: pwsh
        env:
          # Base64 of a code-signing .pfx and its password; without them
          # (forks, no certificate yet) the exe stays unsigned.
          SIGN_PFX: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:SIGN_PFX) { "No signing certificate: the exe stays unsigned."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX))
          try {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw "signtool.exe not found" }
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:SIGN_PASSWORD "target/${{ matrix.target }}/release/Atollo.exe"
            if ($LASTEXITCODE -ne 0) { throw "signing failed ($LASTEXITCODE)" }
          } finally {
            Remove-Item $pfx -Force
          }
      # The release name of the exe (setup/self_update.rs, asset_name), as
      # the smoke test and the release use it.
      - name: App version
        shell: pwsh
        run: |
          $v = [regex]::Match((Get-Content tauri/Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          "VERSION=$v" >> $env:GITHUB_ENV
      # Under its release name, as a user downloads it.
      - name: Smoke test (x64)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $kit = Join-Path $env:RUNNER_TEMP "kit (1) & co"
          $name = "Atollo-$env:VERSION-win32-x64.exe"
          New-Item -ItemType Directory -Force $kit | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/Atollo.exe" "$kit/$name"
          # Atollo.exe is a window program: without a pipe PowerShell neither
          # waits for it nor reads its output.
          $env_out = & "$kit/$name" env | Write-Output
          if ($LASTEXITCODE -ne 0) {
            Get-ChildItem "$kit/data/app/logs" -File -ErrorAction SilentlyContinue | Get-Content
            throw "env failed ($LASTEXITCODE)"
          }
          $path = ($env_out | Where-Object { $_ -like 'PATH=*' }) -replace '^PATH=', ''
          foreach ($entry in $path -split ';') {
            if (-not ($entry.StartsWith("$kit\data") -or $entry -like "$env:SystemRoot\System32*")) { throw "foreign PATH entry: $entry" }
          }
          $names = (Get-ChildItem $kit -Force).Name | Sort-Object
          if (($names -join ',') -ne "$name,data,projects") { throw "unexpected files: $names" }
      - name: Real install of pwsh, node, git and the editor server (x64)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $kit = Join-Path $env:RUNNER_TEMP "kit (1) & co"
          $exe = "$kit/Atollo-$env:VERSION-win32-x64.exe"
          & $exe prepare --only "pwsh,node,git,vscodium-server" | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "prepare failed ($LASTEXITCODE)" }
          $apps = "$kit/data/apps/win32-x64"
          # One folder per minor version (D-91): exactly one line installed.
          function Line([string]$tool, [string]$file) {
            $found = @(Get-ChildItem -Path "$apps/$tool/*/$file" -ErrorAction SilentlyContinue)
            if ($found.Count -ne 1) { throw "${tool}/<line>/${file}: found $($found.Count)" }
            $found[0].FullName
          }
          & (Line pwsh pwsh.exe) -NoProfile -Command '$PSVersionTable.PSVersion'
          & (Line node node.exe) -v
          & (Line git cmd/git.exe) --version
          if (-not (Test-Path "$apps/vscodium-server/out/server-main.js")) { throw "editor server missing" }
          & $exe prepare --only "pwsh,node" --update-all | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "update check failed" }
      - name: Real kit tests (editor server with the kit environment)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $env:ATOLLO_TEST_KIT = Join-Path $env:RUNNER_TEMP "kit (1) & co"
          cargo test --target ${{ matrix.target }} real_ -- --nocapture --test-threads=1
      - uses: actions/upload-artifact@v6
        with:
          name: Atollo-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/Atollo.exe
          if-no-files-found: error

  release:
    name: Release
    # release-smoke needs bundle-macos and bundle-linux.
    needs: [build, release-smoke]
    if: startsWith(github.ref, 'refs/tags/app-v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches the app version
        shell: pwsh
        run: |
          # The self-updater compares app-vX.Y.Z with the exe's CARGO_PKG_VERSION.
          $manifest = Get-Content tauri/Cargo.toml -Raw
          $package = [regex]::Match($manifest, '(?ms)^\[package\][^\n]*\n(.*?)(?=^\[|\z)').Groups[1].Value
          $version = [regex]::Match($package, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "version '$version' is not X.Y.Z: the updater would ignore it" }
          # The tag is read from the environment, never pasted into the script.
          if ($env:GITHUB_REF_NAME -ne "app-v$version") { throw "tag $env:GITHUB_REF_NAME does not match app-v$version" }
      # Windows exes (Atollo-<triple>) and the macOS and Linux bundles
      # (bundle-<target>), the same artifacts release-smoke started.
      - uses: actions/download-artifact@v7
        with:
          pattern: Atollo-*
          path: artifacts
      - uses: actions/download-artifact@v7
        with:
          pattern: bundle-*
          path: artifacts
      - name: Release assets
        shell: pwsh
        env:
          ARM64_RUNNERS: ${{ vars.ARM64_RUNNERS }}
        run: |
          # Names and .sha256 files as read by tauri/src/setup/self_update.rs
          # (asset_name): Atollo-<version>-<target>.exe, .app.zip and
          # .AppImage; the tar.gz, named the same way, is downloaded by hand.
          $version = $env:GITHUB_REF_NAME.Substring('app-v'.Length)
          New-Item -ItemType Directory -Force dist | Out-Null
          function Publish([string]$from, [string]$name) {
            if (-not (Test-Path $from)) { throw "missing release input: $from" }
            Copy-Item $from "dist/$name"
            $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            # A bundle comes with the .sha256 of its job: it must agree.
            if (Test-Path "$from.sha256") {
              $said = ((Get-Content "$from.sha256" -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
              if ($said -ne $hash) { throw "${name}: SHA-256 $hash, its .sha256 says $said" }
            }
            Set-Content "dist/$name.sha256" "$hash  $name" -Encoding ascii
          }
          $exes = @{ 'x86_64-pc-windows-msvc' = 'win32-x64'; 'aarch64-pc-windows-msvc' = 'win32-arm64' }
          foreach ($triple in $exes.Keys) { Publish "artifacts/Atollo-$triple/Atollo.exe" "Atollo-$version-$($exes[$triple]).exe" }
          $unix = @('darwin-arm64', 'darwin-x64', 'linux-x64')
          # Without ARM64 runners there is no linux-arm64 build (bundle-linux).
          if ($env:ARM64_RUNNERS -ne 'off') { $unix += 'linux-arm64' }
          foreach ($target in $unix) {
            $files = if ($target -like 'darwin-*') { @("Atollo-$version-$target.app.zip") } else { @("Atollo-$version-$target.AppImage", "Atollo-$version-$target.tar.gz") }
            foreach ($name in $files) { Publish "artifacts/bundle-$target/$name" $name }
          }
          Get-ChildItem dist | Format-Table Name, Length
      # The notes say how to start each download (README «Come si usa»).
      - name: GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          # The stage in the release's title and notes ("alpha", "beta"; empty
          # for a stable one). Never a GitHub pre-release: the self-updater
          # skips those, and the version stays X.Y.Z.
          RELEASE_STAGE: alpha
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.Substring('app-v'.Length)
          $stage = "$env:RELEASE_STAGE".Trim()
          $title = if ($stage) { "Atollo $version $stage" } else { "Atollo $version" }
          $intro = if ($stage) { "**This is an $stage version**: still being tried on every system, it may have rough edges. Problems and ideas: https://github.com/nabre/atollo/issues`n`n" } else { '' }
          $notes = $intro + @'
          Atollo {0}. Put the app in an empty folder (a USB stick, an external drive, a folder of yours): `projects` and `data` are created next to it. A kit that already has the app updates itself.

          **Windows** (x64, ARM64): `Atollo-{0}-win32-x64.exe` or `Atollo-{0}-win32-arm64.exe`: double-click it, or put it in place of your old Atollo exe. An update gives the file the new version's name.

          **macOS 12 or later** (Apple Silicon: `Atollo-{0}-darwin-arm64.app.zip`, Intel: `Atollo-{0}-darwin-x64.app.zip`): ad hoc signed, not notarized. Unzip, move `Atollo.app` with the Finder into the kit folder, then in Terminal `xattr -dr com.apple.quarantine /path/to/kit/Atollo.app` and open it from that folder. Without this step macOS starts it from a temporary copy (App Translocation) and Atollo stops with the same command.

          **Linux** (x64, ARM64; glibc 2.35 or later): `Atollo-{0}-linux-<arch>.AppImage`, then `chmod +x` and start it; an update gives the file the new version's name. Without FUSE (containers, some minimal distributions): run `./Atollo-{0}-linux-<arch>.AppImage --appimage-extract-and-run`, or use `Atollo-{0}-linux-<arch>.tar.gz` with WebKitGTK 4.1 installed (the tar.gz does not update itself).

          Each file has its `.sha256`.
          '@ -f $version
          $file = Join-Path $env:RUNNER_TEMP 'notes.md'
          Set-Content $file $notes -Encoding utf8
          # The app's release is the repository's latest, never httpd's or PHP's.
          gh release create $tag (Get-ChildItem dist).FullName --verify-tag --title $title --notes-file $file --latest
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)" }
