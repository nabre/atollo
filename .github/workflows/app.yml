name: App

on:
  push:
    branches: [main]
    tags: ['app-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  # A release run is never cancelled: each ref has its own group anyway.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: Lint and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Frontend dependencies
        run: npm ci --no-fund --no-audit
      # One step per command: a multi-line pwsh step only fails on the last
      # command's exit code.
      - name: Frontend lint and types
        run: npm -w ui run lint
      - name: Frontend format
        run: npm -w ui run format:check
      - name: Frontend tests
        run: npm -w ui test
      - name: Frontend build
        run: npm -w ui run build
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test

  # The crate compiles on macOS and Linux too (B7 / N-A1): verification
  # only, nothing is built or shipped for them.
  check-unix:
    name: Check ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries of Tauri 2 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev libxdo-dev pkg-config
      # tauri::generate_context! needs the frontend in dist/.
      - name: Frontend dependencies
        run: npm ci --no-fund --no-audit
      - name: Frontend build
        run: npm -w ui run build
      - name: cargo check
        run: cargo check
      # The tests too on Linux; on macOS tauri 2.12's test feature does not
      # build (mock runtime without `transparent`).
      - name: cargo check (tests)
        if: runner.os == 'Linux'
        run: cargo check --all-targets

  build:
    name: Build ${{ matrix.target }}
    needs: check
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Frontend dependencies
        run: npm ci --no-fund --no-audit
      - name: Build (no installer)
        run: ./node_modules/.bin/tauri build --no-bundle --target ${{ matrix.target }}
      - name: No elevation in the manifest
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/Dev-Kit.exe"
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          if ($text -notmatch 'requestedExecutionLevel level="asInvoker"') { throw "asInvoker missing" }
          if ($text -match 'requireAdministrator|highestAvailable') { throw "elevation requested" }
      - name: Sign the exe (optional)
        shell: pwsh
        env:
          # Base64 of a code-signing .pfx and its password; without them
          # (forks, no certificate yet) the exe stays unsigned.
          SIGN_PFX: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:SIGN_PFX) { "No signing certificate: the exe stays unsigned."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX))
          try {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw "signtool.exe not found" }
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:SIGN_PASSWORD "target/${{ matrix.target }}/release/Dev-Kit.exe"
            if ($LASTEXITCODE -ne 0) { throw "signing failed ($LASTEXITCODE)" }
          } finally {
            Remove-Item $pfx -Force
          }
      - name: Smoke test (x64)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $kit = Join-Path $env:RUNNER_TEMP "kit (1) & co"
          New-Item -ItemType Directory -Force $kit | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/Dev-Kit.exe" $kit
          # Dev-Kit.exe is a window program: without a pipe PowerShell neither
          # waits for it nor reads its output.
          $env_out = & "$kit/Dev-Kit.exe" env | Write-Output
          if ($LASTEXITCODE -ne 0) {
            Get-ChildItem "$kit/data/app/logs" -File -ErrorAction SilentlyContinue | Get-Content
            throw "env failed ($LASTEXITCODE)"
          }
          $path = ($env_out | Where-Object { $_ -like 'PATH=*' }) -replace '^PATH=', ''
          foreach ($entry in $path -split ';') {
            if (-not ($entry.StartsWith("$kit\data") -or $entry -like "$env:SystemRoot\System32*")) { throw "foreign PATH entry: $entry" }
          }
          $names = (Get-ChildItem $kit -Force).Name | Sort-Object
          if (($names -join ',') -ne 'data,Dev-Kit.exe,projects') { throw "unexpected files: $names" }
      - name: Real install of pwsh, node, git and the editor server (x64)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $kit = Join-Path $env:RUNNER_TEMP "kit (1) & co"
          & "$kit/Dev-Kit.exe" prepare --only "pwsh,node,git,vscodium-server" | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "prepare failed ($LASTEXITCODE)" }
          $apps = "$kit/data/apps/win32-x64"
          # One folder per minor version (D-91): exactly one line installed.
          function Line([string]$tool, [string]$file) {
            $found = @(Get-ChildItem -Path "$apps/$tool/*/$file" -ErrorAction SilentlyContinue)
            if ($found.Count -ne 1) { throw "${tool}/<line>/${file}: found $($found.Count)" }
            $found[0].FullName
          }
          & (Line pwsh pwsh.exe) -NoProfile -Command '$PSVersionTable.PSVersion'
          & (Line node node.exe) -v
          & (Line git cmd/git.exe) --version
          if (-not (Test-Path "$apps/vscodium-server/out/server-main.js")) { throw "editor server missing" }
          & "$kit/Dev-Kit.exe" prepare --only "pwsh,node" --update-all | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "update check failed" }
      - name: Real kit tests (editor server with the kit environment)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $env:DEVKIT_TEST_KIT = Join-Path $env:RUNNER_TEMP "kit (1) & co"
          cargo test --target ${{ matrix.target }} real_ -- --nocapture --test-threads=1
      - uses: actions/upload-artifact@v4
        with:
          name: Dev-Kit-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/Dev-Kit.exe
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/app-v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the app version
        shell: pwsh
        run: |
          # The self-updater compares app-vX.Y.Z with the exe's CARGO_PKG_VERSION.
          $manifest = Get-Content tauri/Cargo.toml -Raw
          $package = [regex]::Match($manifest, '(?ms)^\[package\][^\n]*\n(.*?)(?=^\[|\z)').Groups[1].Value
          $version = [regex]::Match($package, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "version '$version' is not X.Y.Z: the updater would ignore it" }
          # The tag is read from the environment, never pasted into the script.
          if ($env:GITHUB_REF_NAME -ne "app-v$version") { throw "tag $env:GITHUB_REF_NAME does not match app-v$version" }
      - uses: actions/download-artifact@v4
        with:
          pattern: Dev-Kit-*
          path: artifacts
      - name: Release assets
        shell: pwsh
        run: |
          # Names and .sha256 files as read by tauri/src/setup/self_update.rs.
          New-Item -ItemType Directory -Force dist | Out-Null
          $assets = @{ 'x86_64-pc-windows-msvc' = 'Dev-Kit-x64.exe'; 'aarch64-pc-windows-msvc' = 'Dev-Kit-arm64.exe' }
          foreach ($target in $assets.Keys) {
            $name = $assets[$target]
            Move-Item "artifacts/Dev-Kit-$target/Dev-Kit.exe" "dist/$name"
            $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content "dist/$name.sha256" "$hash  $name" -Encoding ascii
          }
          Get-ChildItem dist | Format-Table Name, Length
      - name: GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.Substring('app-v'.Length)
          gh release create $tag (Get-ChildItem dist).FullName --verify-tag --title "Dev-Kit $version" --notes "Dev-Kit $version for Windows x64 and arm64: replace Dev-Kit.exe, or let the app update itself."
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)" }
