# The commands of the app's terminal on every system (editor/pty.rs,
# commands/terminals.rs; D-109, D-148). Written by hand, not generated from
# build.rs COMMANDS: one permission for the five commands, granted by
# capabilities/main.json.

[[permission]]
identifier = "allow-pty-sessions"
description = "Enables the commands of the app's terminal sessions: list, backlog, write, resize, close."
commands.allow = ["pty_sessions", "pty_backlog", "pty_write", "pty_resize", "pty_close"]
