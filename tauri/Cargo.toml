[package]
name = "atollo"
version = "0.2.0"
description = "Atollo — Universal Portable Dev & AI Workspace"
authors = ["nabre"]
license = "MIT"
edition = "2021"
rust-version = "1.93"
publish = false

[[bin]]
name = "Atollo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
thiserror = "2.0.21"
sha2 = "0.11.0"
sha3 = "0.11.0"
ureq = { version = "3.4.2", default-features = false, features = ["native-tls", "json", "gzip"] }
native-tls = "0.2.18"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tar = "0.4.46"
flate2 = "1.1.10"
sevenz-rust2 = "0.23.0"
lzma-rust2 = { version = "0.21", default-features = false, features = ["std", "optimization", "xz", "encoder"] }
base64 = "0.23.1"
regex = "1.13.1"

# Win32 APIs, WebView2, junctions and the system proxy: Windows only, so the
# same crate also builds for macOS and Linux (B7 / N-A1).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
junction = "2.1.0"
ureq = { version = "3.4.2", default-features = false, features = ["win-system-proxy"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# The in-app terminal of macOS and Linux (D-109): a PTY per session. Windows
# keeps its classic consoles (D-57, D-95).
portable-pty = "=0.9.0"
# Folder and file pickers of macOS and Linux (NSOpenPanel, GTK), called from
# Rust only; Windows keeps IFileOpenDialog. rfd directly, not
# tauri-plugin-dialog: the plugin replaces window.alert and window.confirm
# in every webview, the editor's too.
rfd = { version = "=0.16.0", default-features = false, features = ["gtk3"] }
# Antigravity's login in the Keychain (macOS) and the Secret Service (Linux),
# WP-4.1. 3.6.3: the last release with these features (4.x moved the stores
# into separate crates). Windows keeps its own Credential Manager code.
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "sync-secret-service"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_Credentials",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_IO",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
tauri = { version = "=2.12.1", features = ["test"] }
